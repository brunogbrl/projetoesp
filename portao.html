<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08101f">
<title>Acesso Portão</title>
<style>
:root{--bg:#07101f;--line:#233652;--text:#f5f8ff;--muted:#91a2c1;--cyan:#36e0c0;--danger:#ff8298}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:18px;color:var(--text);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -15%,#213968 0,#0c1930 38%,var(--bg) 78%)}.shell{width:min(100%,450px);padding:clamp(22px,6vw,34px) clamp(17px,6vw,28px) 24px;border:1px solid var(--line);border-radius:30px;text-align:center;background:linear-gradient(145deg,#142440e8,#0b1528ed);box-shadow:0 24px 80px #0009}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:13px 0 7px;font-size:clamp(27px,8vw,39px);letter-spacing:-.045em}.intro{margin:0 0 26px;color:var(--muted);font-size:14px}.scene{position:relative;height:175px;margin-bottom:22px;overflow:hidden;border:1px solid #263a5b;border-radius:22px;background:linear-gradient(#0a1427,#0b1323)}.moon{position:absolute;top:20px;right:30px;width:13px;height:13px;border-radius:50%;background:#fff4c2;box-shadow:0 0 20px #fff4c288}.ground{position:absolute;right:10%;bottom:18px;left:10%;height:8px;border-radius:8px;background:#2a3c60;box-shadow:0 12px #182641}.gate{position:absolute;z-index:1;bottom:26px;left:50%;width:min(72%,230px);height:104px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;border:3px solid #7184b0;border-bottom:0;border-radius:11px 11px 0 0;background:linear-gradient(135deg,#334b78,#192945);transform:translateX(-50%);transform-origin:left bottom;transition:transform .9s,opacity .9s}.gate span{border:1px solid #61749e;border-radius:3px;background:#172643}.scene.open .gate{transform:translateX(-50%) perspective(500px) rotateY(-78deg);opacity:.35}.signal{position:absolute;z-index:2;top:51%;left:50%;width:74px;height:74px;padding:12px;border-radius:50%;color:var(--cyan);background:#182949e8;box-shadow:0 0 0 8px #18294955;transform:translate(-50%,-50%)}.signal svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.wave{opacity:.24}.dot{fill:currentColor;stroke:none;opacity:.85}.scene.open .wave{animation:send .9s ease-in-out infinite}.scene.open .wave:nth-child(1){animation-delay:.3s}.scene.open .wave:nth-child(2){animation-delay:.15s}.scene.open .wave:nth-child(3){animation-delay:0s}@keyframes send{0%,100%{opacity:.2}45%{opacity:1;filter:drop-shadow(0 0 5px var(--cyan))}}.action{width:100%;min-height:62px;border:0;border-radius:17px;cursor:pointer;color:white;font:800 16px inherit;letter-spacing:.04em;background:linear-gradient(135deg,#8179ff,#564de8);box-shadow:0 12px 28px #5c54ec55;transition:transform .15s,filter .15s}.action:hover{filter:brightness(1.1);transform:translateY(-2px)}.action:active{transform:translateY(1px)}.action:disabled{cursor:wait;opacity:.65;transform:none}.state{min-height:22px;margin:16px 0 18px;color:var(--muted);font-size:13px}.state.ok{color:var(--cyan)}.state.error{color:var(--danger)}.footer{margin-top:22px;color:#657694;font-size:11px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="shell"><div class="eyebrow">Controle local</div><h1>Acesso Portão</h1><p class="intro">Acione o portão com segurança e praticidade</p><section class="scene" id="scene" aria-label="Animação do portão"><div class="moon"></div><div class="ground"></div><div class="gate"><span></span><span></span><span></span><span></span></div><div class="signal" aria-hidden="true"><svg viewBox="0 0 48 48"><path class="wave" d="M5 18.5a28 28 0 0 1 38 0"/><path class="wave" d="M11 25a19.5 19.5 0 0 1 26 0"/><path class="wave" d="M17.5 31.5a10.5 10.5 0 0 1 13 0"/><circle class="dot" cx="24" cy="38" r="2.8"/></svg></div></section><button class="action" id="action" type="button">ABRIR PORTÃO</button><div class="state" id="state">Sistema pronto</div><div class="footer">Dispositivo protegido na rede local</div></main>
<script>const URL_ACIONAMENTO='http://192.168.1.50/api/open';const action=document.querySelector('#action'),scene=document.querySelector('#scene'),state=document.querySelector('#state');action.addEventListener('click',async()=>{action.disabled=true;scene.classList.add('open');state.className='state';state.textContent='Acionando o portão...';try{const response=await fetch(URL_ACIONAMENTO,{method:'POST',cache:'no-store'});if(!response.ok)throw new Error();state.className='state ok';state.textContent='Comando enviado com sucesso'}catch(error){state.className='state error';state.textContent='Não foi possível acionar o portão'}finally{setTimeout(()=>{action.disabled=false;scene.classList.remove('open')},1600)}});</script>
</body>
</html>
