<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08101f">
<title>Acesso Portão</title>
<style>
:root{--bg:#07101f;--line:#233652;--text:#f5f8ff;--muted:#91a2c1;--cyan:#36e0c0;--danger:#ff8298}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:18px;color:var(--text);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% -15%,#213968 0,#0c1930 38%,var(--bg) 78%)}.shell{width:min(100%,450px);padding:clamp(22px,6vw,34px) clamp(17px,6vw,28px) 24px;border:1px solid var(--line);border-radius:30px;text-align:center;background:linear-gradient(145deg,#142440e8,#0b1528ed);box-shadow:0 24px 80px #0009}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}h1{margin:13px 0 7px;font-size:clamp(27px,8vw,39px);letter-spacing:-.045em}.intro{margin:0 0 26px;color:var(--muted);font-size:14px}.scene{position:relative;height:175px;margin-bottom:22px;overflow:hidden;perspective:900px;border:1px solid #263a5b;border-radius:22px;background:linear-gradient(#0a1427,#0b1323)}.ground{position:absolute;right:10%;bottom:18px;left:10%;height:8px;border-radius:8px;background:#2a3c60;box-shadow:0 12px #182641}.gate{position:absolute;z-index:1;bottom:26px;left:50%;width:112px;height:145px;padding:8px;display:block;border:4px solid #7184b0;border-radius:8px 8px 2px 2px;background:linear-gradient(90deg,#263e69,#172945 48%,#304b7c);transform:translateX(-50%);transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s}.gate span{display:block;position:relative;width:100%;height:100%;border:2px solid #526b9d;border-radius:2px;background:repeating-linear-gradient(90deg,#20375e 0,#20375e 13px,#35527f 14px,#172643 16px)}.gate span::before{content:"";position:absolute;inset:12px 10px;border:1px solid #6880ad;border-radius:2px;background:linear-gradient(90deg,transparent 48%,#6880ad 49%,#6880ad 51%,transparent 52%)}.gate::before{content:"";position:absolute;left:-11px;top:18px;width:7px;height:22px;border-radius:3px;background:#90a5d0;box-shadow:0 48px #90a5d0,0 96px #90a5d0}.gate::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border:2px solid #36e0c0;border-radius:50%;box-shadow:0 0 8px #36e0c0;transform:translateY(-50%)}.scene.open .gate{transform:translateX(-50%) rotateY(-72deg);opacity:.9}.signal{position:absolute;z-index:2;top:25%;left:88%;width:48px;height:48px;padding:10px;color:var(--cyan);transform:translate(-50%,-50%)}.signal svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.wave{opacity:.24}.dot{fill:currentColor;stroke:none;opacity:.85}.scene.open .wave{animation:send .9s ease-in-out infinite}.scene.open .wave:nth-child(1){animation-delay:.3s}.scene.open .wave:nth-child(2){animation-delay:.15s}.scene.open .wave:nth-child(3){animation-delay:0s}@keyframes send{0%,100%{opacity:.2}45%{opacity:1;filter:drop-shadow(0 0 5px var(--cyan))}}.action{width:100%;min-height:62px;border:0;border-radius:17px;cursor:pointer;color:white;font:800 16px inherit;letter-spacing:.04em;background:linear-gradient(135deg,#8179ff,#564de8);box-shadow:0 12px 28px #5c54ec55;transition:transform .15s,filter .15s}.action:hover{filter:brightness(1.1);transform:translateY(-2px)}.action:active{transform:translateY(1px)}.action:disabled{cursor:wait;opacity:.65;transform:none}.state{min-height:22px;margin:16px 0 18px;color:var(--muted);font-size:13px}.state.ok{color:var(--cyan)}.state.error{color:var(--danger)}.footer{margin-top:22px;color:#657694;font-size:11px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.scene{height:190px;perspective:900px}.door-frame{position:absolute;z-index:1;left:50%;bottom:23px;width:128px;height:154px;transform:translateX(-50%);border:7px solid #7184b0;border-bottom:0;border-radius:8px 8px 0 0;background:#182945;box-shadow:inset 0 0 0 3px #314b78}.door{position:absolute;inset:5px 5px 0;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}.door-face{position:absolute;inset:0;border:3px solid #91a5d0;border-radius:3px 3px 0 0;background:repeating-linear-gradient(90deg,#294675 0,#294675 16px,#1b3158 17px,#1b3158 20px);box-shadow:inset 0 0 0 5px #192d50}.door-panel{position:absolute;left:15px;right:15px;height:42px;border:2px solid #617ba9;border-radius:3px;background:#20375e;box-shadow:inset 0 0 0 3px #1d355d}.door-panel.top{top:14px}.door-panel.bottom{bottom:14px}.hinge{position:absolute;z-index:2;left:-10px;width:8px;height:22px;border-radius:3px;background:#b0bee0;box-shadow:0 52px #b0bee0,0 104px #b0bee0}.handle{position:absolute;z-index:2;right:12px;top:50%;width:9px;height:9px;border:2px solid #36e0c0;border-radius:50%;box-shadow:0 0 9px #36e0c0}.scene.open .door{transform:rotateY(-72deg)}.signal{top:27%;left:85%;width:46px;height:46px;padding:8px;background:transparent;box-shadow:none}.signal svg{filter:drop-shadow(0 0 4px #36e0c0)}</style>
</head>
<body>
<main class="shell"><div class="eyebrow">Controle local</div><h1>Acesso Portão</h1><p class="intro">Acione o portão com segurança e praticidade</p><section class="scene" id="scene" aria-label="Animação da porta"><div class="ground"></div><div class="door-frame"><div class="door"><div class="door-face"><div class="door-panel top"></div><div class="door-panel bottom"></div><div class="hinge"></div><div class="handle"></div></div></div></div><div class="signal" aria-hidden="true"><svg viewBox="0 0 48 48"><path class="wave" d="M5 18.5a28 28 0 0 1 38 0"/><path class="wave" d="M11 25a19.5 19.5 0 0 1 26 0"/><path class="wave" d="M17.5 31.5a10.5 10.5 0 0 1 13 0"/><circle class="dot" cx="24" cy="38" r="2.8"/></svg></div></section><button class="action" id="action" type="button">ABRIR PORTÃO</button><div class="state" id="state">Sistema pronto</div></main>
<script>const URL_ACIONAMENTO='http://192.168.1.50/api/open';const action=document.querySelector('#action'),scene=document.querySelector('#scene'),state=document.querySelector('#state');action.addEventListener('click',async()=>{action.disabled=true;scene.classList.add('open');state.className='state';state.textContent='Acionando o portão...';try{const response=await fetch(URL_ACIONAMENTO,{method:'POST',cache:'no-store'});if(!response.ok)throw new Error();state.className='state ok';state.textContent='Comando enviado com sucesso'}catch(error){state.className='state error';state.textContent='Não foi possível acionar o portão'}finally{setTimeout(()=>{action.disabled=false;scene.classList.remove('open')},1600)}});</script>
</body>
</html>
